name: CI

# Runs on every push and pull request. Nothing here needs a secret, because
# nothing here talks to an external source — the app is fully testable against
# its bundled data set.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  analyze-and-test:
    name: 분석 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 선언된 asset 경로 git 추적 확인
        # Runs first, before any flutter step, for the same reason
        # tools/commit_gate.py orders it first: it is the check that would
        # have caught `assets/icons/` (declared in pubspec.yaml, present on
        # disk, tracked by git nowhere) before spending any time on the rest
        # of this job. Needs only python + git, so it does not wait on the
        # Flutter SDK setup below.
        run: python scripts/validate/check_declared_assets.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 코드 생성 확인
        # Drift output is committed. If regenerating changes anything, the
        # commit is stale and the build must stop rather than silently drift.
        #
        # The comparison is against build_runner output *after* `dart
        # format`, not the raw generator output, because the two disagree on
        # this toolchain: build_runner resolves `dart_style` through
        # pubspec.lock (a pinned library dependency), while the standalone
        # `dart format` below ships bundled inside the Flutter SDK itself.
        # The two format a `typedef X = Y Function({...})` differently, so
        # comparing raw generator output against the committed (which was,
        # itself, formatted before being committed) file reports "drift"
        # that is not real -- confirmed by formatting a fresh regeneration of
        # database.g.dart and diffing it against HEAD: identical. Without
        # this note, the next person deletes the format line as redundant
        # with the "포맷 확인" step below -- it looks redundant on a clean
        # checkout, and only stops being redundant right after a fresh
        # codegen run, which is exactly what this step just did.
        #
        # tools/commit_gate.py's local gate makes the equivalent fix, scoped
        # to only the generated files (never a bare `dart format .`) because
        # a local run can't assume a disposable checkout the way CI can.
        run: |
          dart run build_runner build
          find lib -name '*.g.dart' -o -name '*.freezed.dart' -o -name '*.gr.dart' | xargs -r dart format
          if [ -n "$(git status --porcelain lib)" ]; then
            echo "::error::생성된 코드가 커밋과 다릅니다. build_runner 를 실행하고 커밋하세요."
            git --no-pager diff --stat lib
            exit 1
          fi

      - name: 포맷 확인
        run: dart format --set-exit-if-changed .

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        # Screenshots are excluded: they are review artefacts whose pixels
        # depend on host fonts, and a pixel diff must never block a build.
        run: flutter test --exclude-tags screenshots --reporter expanded

  data:
    name: 데이터 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 파이프라인 단위 테스트
        # The normalisation rules (clustering, alias resolution, Korean text)
        # have no Dart equivalent, so nothing else covers them.
        run: python -m unittest discover -s scripts/tests -v

      - name: 스키마 재생성 확인
        run: |
          python scripts/publish/build_schemas.py
          if [ -n "$(git status --porcelain schemas)" ]; then
            echo "::error::스키마 파일이 생성 결과와 다릅니다."
            git --no-pager diff --stat schemas
            exit 1
          fi

      - name: 배포본 검증
        # Structure, provenance, inning sums, duplicates, privacy, the weather
        # forecast-horizon rule, and demo separation.
        run: python scripts/validate/validate_data.py public-data

      - name: seed 재생성 가능 여부
        # The seed must be reproducible from the generator, or the committed
        # data set and the script have diverged.
        run: |
          python scripts/publish/build_seed.py --generated-at 2026-08-30T00:00:00Z
          python scripts/validate/validate_data.py public-data

      - name: 색 대비 검사 (Task A ratchet)
        # Ratchet: contrast_baseline.json freezes the 11 pre-existing WCAG
        # shortfalls as of the day this check went live. This only fails on a
        # NEW shortfall (a regression not in the baseline) or a baseline entry
        # that now passes and was never removed (stale). See
        # scripts/validate/check_contrast.py's module docstring.
        run: python scripts/validate/check_contrast.py

  build-android:
    name: Android 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [analyze-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: APK 빌드 (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
