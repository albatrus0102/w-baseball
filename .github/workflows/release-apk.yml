name: APK 빌드·배포

# Phone-installable builds, triggered from a phone.
#
# CI already uploads a debug APK as a workflow artifact, but an artifact is a
# zip behind a login — awkward to install from a handset. This publishes a
# GitHub Release with the APK attached, so the download link works in a mobile
# browser and Android installs it directly.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '빌드 종류'
        type: choice
        options: [debug, release]
        default: debug
      manifest_base_url:
        description: '정적 데이터 주소 (비우면 번들 seed만 사용)'
        required: false
        default: ''
      note:
        description: '릴리스 노트에 남길 한 줄'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # One build at a time: two runs would race for the same release tag.
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    name: APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      # The same gates CI runs. A build that reaches a phone should not be one
      # that would have failed review.
      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test --exclude-tags screenshots

      - name: 데이터 검증
        run: python scripts/validate/validate_data.py public-data

      - name: APK 빌드
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          MANIFEST: ${{ inputs.manifest_base_url }}
        run: |
          ARGS=()
          if [ -n "$MANIFEST" ]; then
            ARGS+=(--dart-define="WB_MANIFEST_BASE_URL=$MANIFEST")
          fi
          # Split per ABI: a universal APK is ~69MB, and each split is roughly
          # a third of that — which matters on mobile data.
          flutter build apk --"$BUILD_TYPE" --split-per-abi "${ARGS[@]}"
          ls -la build/app/outputs/flutter-apk/

      - name: 릴리스 태그 결정
        id: tag
        run: |
          echo "tag=build-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 릴리스 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.build_type }} · ${{ steps.tag.outputs.tag }}
          # Marked as a prerelease: these are test builds, not store releases,
          # and they are signed with a debug key.
          prerelease: true
          body: |
            ${{ inputs.note }}

            - 빌드 종류: `${{ inputs.build_type }}`
            - 데이터 주소: `${{ inputs.manifest_base_url || '번들 seed만 사용' }}`
            - 커밋: ${{ github.sha }}

            **경기 기록·순위·선수는 전부 데모 데이터입니다.** 실제 기록이 아닙니다.

            대부분의 최신 안드로이드 기기는 `arm64-v8a` 를 받으면 됩니다.
            설치하려면 "출처를 알 수 없는 앱" 설치를 허용해야 합니다.
          files: build/app/outputs/flutter-apk/*.apk
